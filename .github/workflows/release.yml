name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    name: vet + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Verify version matches tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          src="$(tr -d '[:space:]' < VERSION)"
          if [ -z "$src" ]; then
            echo "::error::VERSION file is empty"
            exit 1
          fi
          if [ "$tag" != "$src" ]; then
            echo "::error::tag '$GITHUB_REF_NAME' does not match VERSION file ('$src')"
            echo "::error::update VERSION to '$tag' and commit it before tagging"
            exit 1
          fi
          echo "version OK: tag ${GITHUB_REF_NAME} matches VERSION (${src})"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  build:
    name: build (${{ matrix.os }}/${{ matrix.arch }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            ext: ""
          - os: linux
            arch: arm64
            ext: ""
          - os: windows
            arch: amd64
            ext: ".exe"
          - os: darwin
            arch: amd64
            ext: ""
          - os: darwin
            arch: arm64
            ext: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          artifact="dist/scroff-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}"
          mkdir -p dist
          go build -trimpath -o "$artifact" .
          chmod +x "$artifact"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: scroff-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Build checksums
        run: |
          cd dist
          find . -type f -exec sha256sum "{}" + > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: HA Screen Off ${{ github.ref_name }}
          files: dist/**
          fail_on_unmatched_files: true